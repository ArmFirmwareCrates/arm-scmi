[package]
name = "arm-scmi"
version = "0.1.0"
authors = [
    "Imre Kis <imre.kis@arm.com>",
    "Ludovic Mermod <ludovic.mermod@arm.com>"
]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Arm System Control and Management Interface driver"
repository = "https://git.trustedfirmware.org/arm-firmware-crates/arm-scmi.git"
keywords = ["arm", "scmi", "system", "control", "interface"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]
readme = "README.md"
rust-version = "1.88"

[dependencies]
bitflags = "2.13.1"
num_enum = { version = "0.7.6", default-features = false }
pastey = "0.2.3"
thiserror = { version = "2.0.20", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }
